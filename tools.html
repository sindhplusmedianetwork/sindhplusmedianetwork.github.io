<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>500+ Free Online Tools — Calculators, Converters, Generators | Sindh Plus Media Network</title>
<meta name="description" content="500+ free online tools: calculators, unit converters, finance tools, text tools, SEO tools, PDF tools, image tools & more. No signup, works instantly.">
<meta name="keywords" content="free online tools, calculators, converters, BMI calculator, age calculator, QR generator, password generator, unit converter, currency converter, SEO tools, PDF tools, free tools online">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://sindhplusmedianetwork.github.io/tools.html">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f5f5f5;color:#222}
.topbar{background:#c0392b;color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
.topbar a{color:#fff;text-decoration:none;font-weight:700;font-size:18px}
.searchbar{max-width:720px;margin:20px auto 10px;padding:0 16px}
.searchbar input{width:100%;padding:14px 18px;border:2px solid #ff7a00;border-radius:30px;font-size:16px;outline:none}
.cats{max-width:720px;margin:0 auto;padding:10px 16px 40px}
.cat{margin-bottom:8px}
.cat h2{background:#fff;padding:14px 18px;border-radius:10px;font-size:18px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.06);display:flex;justify-content:space-between;align-items:center}
.cat h2 .cnt{background:#ff7a00;color:#fff;font-size:12px;padding:2px 10px;border-radius:12px}
.toollist{display:none;padding:8px 0}
.toollist.open{display:block}
.tool{background:#fff;margin:6px 0;padding:12px 16px;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.tool a{color:#1a73e8;text-decoration:none;font-weight:600;font-size:15px}
.tool p{color:#666;font-size:13px;margin-top:4px}
.loading{text-align:center;color:#888;padding:40px}
</style>
</head>
<body>
<div class="topbar"><a href="index.html">&#8592;</a><a href="index.html">Sindh Plus Media Network</a></div>
<div class="searchbar"><input id="q" placeholder="Search 500+ tools... (e.g. BMI, QR, PDF, age)" oninput="filter()"></div>
<div class="cats" id="cats"><div class="loading">Loading tools...</div></div>
<div id="nope" style="text-align:center;color:#888;padding:40px;display:none">No tools found. Try another search.</div>
<script>
Promise.all([1,2,3,4].map(function(i){return fetch('assets/tools-idx-'+i+'.json').then(function(r){return r.json();});})).then(function(chunks){
  var idx=[].concat.apply([],chunks);
  var cats={};
  idx.forEach(function(t){ (cats[t.c]=cats[t.c]||[]).push(t); });
  var h='';
  Object.keys(cats).sort().forEach(function(c){
    h+='<div class="cat" data-cat="'+c.toLowerCase()+'"><h2 onclick="this.nextElementSibling.classList.toggle(\'open\')">'+c+' <span class="cnt">'+cats[c].length+'</span></h2><div class="toollist">';
    cats[c].forEach(function(t){
      h+='<div class="tool" data-name="'+(t.n+' '+t.d).toLowerCase().replace(/"/g,'')+'"><a href="tools/'+t.s+'.html">'+t.n+'</a><p>'+t.d.substring(0,120)+'</p></div>';
    });
    h+='</div></div>';
  });
  document.getElementById('cats').innerHTML=h;
});
function filter(){
  var q=document.getElementById('q').value.toLowerCase().trim();
  var cats=document.querySelectorAll('.cat');
  var any=false;
  cats.forEach(function(c){
    var tools=c.querySelectorAll('.tool');
    var vis=0;
    tools.forEach(function(t){
      var show=!q||t.getAttribute('data-name').indexOf(q)>=0||c.getAttribute('data-cat').indexOf(q)>=0;
      t.style.display=show?'block':'none';
      if(show)vis++;
    });
    c.style.display=vis?'block':'none';
    if(vis)any=true;
    var list=c.querySelector('.toollist');
    if(q&&vis)list.classList.add('open'); else if(!q)list.classList.remove('open');
  });
  document.getElementById('nope').style.display=any?'none':'block';
}
</script>
</body>
</html>
